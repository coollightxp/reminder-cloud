name: Reminder Engine

on:
  # 定时触发（UTC 时间，北京时间为 UTC+8）
  schedule:
    - cron: '0 1,6 * * *'   # 北京时间 09:00 / 14:00
  # 允许手动触发
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest

    # ✅ 关键：把 Secrets 注入环境变量（解决 KeyError）
    env:
      WX_CORP_ID: ${{ secrets.WX_CORP_ID }}
      WX_AGENT_ID: ${{ secrets.WX_AGENT_ID }}
      WX_CORP_SECRET: ${{ secrets.WX_CORP_SECRET }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run reminder engine
        run: python remind_engine.py
