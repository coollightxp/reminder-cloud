name: Daily Reminder

on:
  schedule:
    - cron: '0 1,6 * * *'   # 北京 09:00 / 14:00
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    env:
      EMAIL_USER: ${{ secrets.EMAIL_USER }}
      EMAIL_PASS: ${{ secrets.EMAIL_PASS }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests

      - name: Run reminder
        run: python remind_engine.py
